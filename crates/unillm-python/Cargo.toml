[package]
name = "unillm-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "PyO3 Python bindings for the unillm SDK"

[lib]
name = "unillm_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
unillm-core = { path = "../unillm-core" }
serde_json = "1"
