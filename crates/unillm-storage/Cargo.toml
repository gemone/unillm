[package]
name = "unillm-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable storage backends for unillm-proxy (keys, models, routes, logs)"

[features]
default = []
# Enable the PostgreSQL backend (`PostgresStore`) + its sqlx integration. The SQLite backend is
# always available; `postgres` adds the parallel PG backend for the cross-DB gate.
postgres = ["sqlx/postgres", "sqlx/uuid"]

[dependencies]
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
