[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "unillm"
version = "0.1.0"
description = "Unified LLM framework — talk to OpenAI, Anthropic, OpenRouter, and DeepSeek through one API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["llm", "openai", "anthropic", "openrouter", "deepseek", "ai"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["anyio>=4"]

[project.urls]
Repository = "https://github.com/gemone/unillm"

[tool.maturin]
manifest-path = "crates/unillm-python/Cargo.toml"
python-source = "python"
module-name = "unillm._native"
features = ["pyo3/extension-module"]
