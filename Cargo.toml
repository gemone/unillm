[workspace]
resolver = "3"
members = ["crates/unillm-core", "crates/unillm-proxy", "crates/unillm-storage"]
# The PyO3 cdylib is built by maturin, not plain cargo; exclude it so `cargo test/clippy
# --workspace` stays fast and doesn't need libpython at link time.
exclude = ["crates/unillm-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gemone/unillm"
authors = ["unillm contributors"]

# Per-crate dependencies are declared explicitly where used; this workspace only pins metadata.
