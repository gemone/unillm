# Local dev dependencies for unillm-proxy (DESIGN.md §11.2, §18).
# Postgres is the primary config/logs/usage backend; Redis is the production rate-limit/cache
# backend (the in-memory fallbacks need no infrastructure).
#
#   docker compose up -d
#   UNILLM_DATABASE_URL=postgres://unillm:unillm@localhost:5432/unillm cargo run -p unillm-proxy
#   UNILLM_PG_TEST_URL=postgres://unillm:unillm@localhost:5432/unillm \
#       cargo test -p unillm-storage --features postgres pg_

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: unillm
      POSTGRES_PASSWORD: unillm
      POSTGRES_DB: unillm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unillm -d unillm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
